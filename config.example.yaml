# Copy to config.yaml and fill in real values. config.yaml is gitignored.
# This example file is safe to commit. It contains no real secrets.
#
# Note the pattern used for PINs below: this file never holds a PIN, it holds
# the NAME of the environment variable the PIN is read from at startup. That
# keeps the secret out of the config file, out of the image, and out of any
# backup of either, and it means a leaked config.yaml leaks nothing. Do not
# "simplify" this into a literal `pin:` field.

server:
  # The public surface, plain HTTP: the CRLs, the CA certificates and the
  # probes. No write endpoint is routed here, so nothing on it needs a
  # client. The URLs written into certificates point at this listener.
  listen_addr: "0.0.0.0:8080"

  # The authenticated surface, mutual TLS. Every write goes through here,
  # and without this block the service serves no write endpoint at all:
  # it starts, warns, and issues nothing.
  tls:
    listen_addr: "0.0.0.0:8443"
    # CKA_LABEL of the service's TLS key pair, on the same token as the
    # intermediate, under its own label. Never the intermediate's label:
    # a handshake signs bytes the peer chooses, and the key that signs
    # certificates must not do that. Load refuses the intermediate's.
    key_label: "ca-tls-key-v1"
    # The service's TLS certificate: a leaf this CA issued over that key,
    # PEM, one certificate. The intermediate is appended at run time.
    #
    # Both the key pair and this certificate come from
    # `hsm-pki-keytool provision-tls-identity`, run with the service
    # stopped. See docs/key-ceremony-and-recovery.md section 8.
    cert_path: "/etc/hsm-pki/tls.pem"

# Who may write, by an identity off the client certificate: a URI SAN as
# written, or the subject common name. Both are required when server.tls
# is set, and refused when it is not. A client must also chain to the
# root in ca.root_cert_path and be in the store as issued and not revoked;
# a name alone authorises nothing. There is no separate client CA: the
# clients are certificates this CA issued.
#
# The first client certificate comes from `hsm-pki-keytool
# issue-client-cert`; after that, a client listed here can issue the next
# one over the API. The command prints the identities a certificate
# carries, which is what goes here.
api:
  # Each issuer is bound to the profiles it may request and the names it
  # may put in a certificate, as "<type>:<glob>" patterns over cn, dns,
  # ip, uri and email. * matches any run of characters; dns matches
  # case-insensitively; ip takes an address, a CIDR range or *. Every
  # name in a request must match a pattern of its type, or the whole
  # request is refused with a 403 that says nothing more; a type with no
  # pattern is a type the identity may not name at all. An identity not
  # listed here issues nothing; an entry granting nothing fails startup;
  # ocsp-responder cannot be granted to anyone.
  issuers:
    "urn:hsm-pki:operator:alice":
      profiles: [tls-server, tls-client]
      names:
        - "dns:*.example.test"
        - "cn:*.example.test"
        - "uri:urn:hsm-pki:operator:*"
  # Not defaulted from issuers, and not bound to who issued what: who may
  # withdraw a certificate is a separate decision, and during an incident
  # the ability to withdraw any certificate is the one that matters.
  revokers: ["urn:hsm-pki:operator:alice"]

pkcs11:
  # Which vendor adapter to use: "softhsm2" or "protectserver".
  # Both implement the same VendorAdapter interface. See
  # docs/architecture.md, "One abstraction over several vendors".
  adapter: "softhsm2"

  # Session budget enforced by the adapter. A session is rejected once either
  # limit is exceeded, and is never silently extended (fail closed).
  session:
    idle_timeout: "15m"
    max_ttl: "8h"

  # SoftHSM2, the universal baseline. No hardware, no proprietary SDK, so
  # this is what CI runs. Install with your distribution's `softhsm2` package,
  # or use ci/softhsm2-dev.Dockerfile.
  softhsm2:
    module_path: "/usr/lib/softhsm/libsofthsm2.so"
    # Token label, as passed to `softhsm2-util --init-token --label`.
    workspace_label: "CHANGE_ME"
    # Environment variable holding the user PIN, not the PIN itself.
    pin_env: "SOFTHSM2_PIN"

  # Thales ProtectServer, via the ProtectToolkit-C PKCS#11 module. Requires
  # your own ProtectToolkit entitlement. docs/test-matrix.md, "Adding a
  # backend", covers token initialization and how to verify the module loads.
  # This path cannot run in public CI. The SDK is proprietary and is never
  # vendored into this repository.
  protectserver:
    # The software-emulation module. A hardware ProtectServer uses
    # libcthsm.so from the same directory instead.
    module_path: "/opt/safenet/protecttoolkit7/ptk/lib/libctsw.so"
    # Label you assigned when initializing the user token with `ctconf`.
    # A freshly installed ProtectToolkit leaves slot 0 unlabelled and
    # uninitialized, so this has no working default.
    workspace_label: "CHANGE_ME"
    # Environment variable holding the user PIN, not the PIN itself. The
    # maintainer's emulator setup uses a throwaway dev PIN; never reuse it
    # anywhere real.
    pin_env: "PROTECTSERVER_PIN"

ca:
  # ECDSA P-256 is the default curve; P-384 is available where a larger
  # security margin is warranted.
  curve: "P-256"
  # The ceiling on any profile's validity. It no longer sets a
  # certificate's lifetime itself: the profile does, and startup refuses a
  # profile that grants more than this. The intermediate's own validity
  # was fixed at ceremony time and is not configurable here.
  cert_ttl_hours: 8760

  # Certificate profiles. A request names one with ?profile=; a request
  # that names none, or one not here, is refused. There is no default:
  # defaulting would re-create "any well-formed CSR gets serverAuth and
  # clientAuth" behind a policy-shaped facade.
  #
  # Absent, the four built-in profiles apply: tls-server (serverAuth, a
  # DNS or IP name required, CN, 90 days), tls-client (clientAuth, an
  # optional URI or email name, CN/O/OU, 90 days), code-signing
  # (codeSigning, CN/O, a year) and ocsp-responder (ocspSigning with
  # id-pkix-ocsp-nocheck, 7 days). Present, this section REPLACES them,
  # so write out every profile the deployment issues under. Every list is
  # a name from a closed vocabulary and an unknown name fails startup:
  #   extended_key_usages: serverAuth clientAuth codeSigning
  #                        emailProtection timeStamping ocspSigning
  #   key_usages:          digitalSignature contentCommitment
  #                        keyEncipherment keyAgreement
  #   san_types:           dns ip uri email
  #   subject:             CN O OU C ST L   (attributes copied from the CSR;
  #                        any other attribute in a CSR is refused)
  #   key_algorithms:      ec-p256 ec-p384 ec-p521 rsa   (rsa is 2048+)
  # keyEncipherment is kept for RSA keys and dropped for EC keys, which
  # cannot do it (RFC 5480). keyCertSign and cRLSign cannot be written
  # here at all: only the ceremony issues CA certificates.
  #
  # profiles:
  #   tls-server:
  #     extended_key_usages: [serverAuth]
  #     key_usages: [digitalSignature, keyEncipherment]
  #     san_types: [dns, ip]
  #     san_required: true
  #     subject: [CN]
  #     key_algorithms: [ec-p256, ec-p384, ec-p521, rsa]
  #     validity_hours: 2160
  #   tls-client:
  #     extended_key_usages: [clientAuth]
  #     key_usages: [digitalSignature, keyEncipherment]
  #     san_types: [uri, email]
  #     subject: [CN, O, OU]
  #     key_algorithms: [ec-p256, ec-p384, ec-p521, rsa]
  #     validity_hours: 2160

  # This service holds the INTERMEDIATE and nothing above it.
  #
  # There is no field naming the root's token, workspace, or key label, and
  # that absence is the security property, not an omission: the root lives
  # on a separate token reachable only from the offline ceremony
  # (cmd/hsm-pki-keytool), so compromising this service cannot reach it.
  # Both values below come from a ceremony run. See
  # docs/key-ceremony-and-recovery.md, "The root ceremony as an operator
  # procedure".

  # CKA_LABEL of the intermediate key pair the ceremony created. Versioned,
  # so rotation provisions -v2 alongside -v1 rather than overwriting it
  # (docs/key-ceremony-and-recovery.md, "Routine intermediate rotation").
  intermediate_key_label: "ca-intermediate-key-v1"
  # The ceremony-produced intermediate certificate. Contains no private key
  # material. The service refuses to start if this is self-signed, since a
  # self-signed CA certificate here would mean a root had been put online.
  intermediate_cert_path: "intermediate.pem"

  # Public ceremony artifacts this service republishes so the CDP and AIA
  # URLs baked into the intermediate at ceremony time actually resolve.
  # Neither is key material; serving them grants no ability to use the
  # root's key. Served at GET /root.crt and GET /root.crl respectively, so
  # a ceremony should be run with:
  #   -root-cert-url https://<this-host>/root.crt
  #   -root-crl-url  https://<this-host>/root.crl
  # PEM on disk -- that is what the ceremony writes and what you copy
  # between hosts. They are served as DER (application/pkix-cert and
  # application/pkix-crl), because that is what a client following a CDP or
  # an AIA pointer expects per RFC 2585; the conversion happens at startup.
  root_cert_path: "root.pem"
  root_crl_path: "root-crl.pem"

  # Externally reachable origin of THIS service -- the address a relying
  # party can resolve, which behind an ingress or load balancer is not what
  # server.listen_addr binds to. Required, with no default.
  #
  # Every certificate this service issues carries two URLs built from it:
  #   <base_url>/crl              the CRL that governs the leaf
  #   <base_url>/intermediate.crt the certificate that signed the leaf
  # Those are baked in at signature time and cannot be edited afterward, so
  # a wrong value here is not a startup failure -- it is a valid certificate
  # pointing at a CRL nobody can fetch, fixable only by re-issuing every
  # certificate signed since. A trailing slash is tolerated; a path prefix
  # is kept ("https://pki.example.com/ca" gives ".../ca/crl").
  #
  # No OCSP URL is issued at all until a responder exists:
  # pointing at a responder that is not there is worse than omitting it.
  base_url: "https://pki.example.test"

  # How long a generated leaf CRL is valid for (thisUpdate to nextUpdate).
  crl_validity_hours: 24

  # Embedded SQLite database holding issued/revoked records and the CRL
  # number counter. Required, with no in-memory fallback: a restart that
  # erases revocations is a security regression, not a durability
  # inconvenience -- a certificate revoked during an incident would reappear
  # as valid in the next CRL. Back this path with a real volume, not
  # container-local scratch space.
  store_path: "ca.db"

  # The delegated OCSP responder. Absent means none: no /ocsp route and
  # no OCSP pointer in issued certificates, because a certificate naming
  # a responder that is not there fails closed at a verifier that
  # requires OCSP. Present, the responder answers GET and POST /ocsp on
  # the public listener from the same store the CRL is built from, with
  # the CRL's freshness window, and a revocation drops both caches.
  #
  # The key lives on the intermediate's token under its own versioned
  # label, from `hsm-pki-keytool provision-ocsp-key`; never the
  # intermediate's key (a compromised responder key must be able to lie
  # about status and nothing else) and never the TLS key's. The
  # responder's certificate is issued by the service itself at startup
  # under the ocsp-responder profile (ocspSigning plus
  # id-pkix-ocsp-nocheck, seven days) and renewed at half-life; it is
  # checked at the point of signing, and an expired one answers tryLater.
  # Certificates issued before the responder existed carry no OCSP
  # pointer and never will: an extension is fixed at signature time.
  ocsp:
    key_label: "ocsp-signing-key-v1"
    # Responder certificate common name; defaults to the intermediate's
    # name plus " OCSP Responder".
    # subject: "hsm-pki-platform OCSP Responder"

  # Normally absent. Raises the number a FRESH store seeds its CRL counter
  # with; an existing counter is never touched.
  #
  # A rebuilt store seeds from the wall clock, which is above anything the
  # old store issued as long as the clock has not moved backwards. If it has
  # -- a restored host with a bad time source -- the new sequence could land
  # below numbers verifiers already hold, and RFC 5280 5.2.3 then lets them
  # ignore every CRL this CA issues afterward. Nothing can recover the last
  # number automatically, because the thing that remembered it is what was
  # lost; an operator who does know it puts it here.
  # crl_number_floor: "1756384000000"

# There is no vault section. Vault custody is planned (docs/architecture.md,
# layer 6) and internal/config has no field for it yet; a section here would
# be parsed as nothing and silently ignored.
