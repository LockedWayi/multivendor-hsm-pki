# Pinned third-party references, checked against upstream on every push
# to main, weekly, and on demand.
#
# Dependabot covers the pins it can see: Dockerfile FROM lines, `uses:`
# values and go.mod. It cannot see ci/scanner-pins.sh, because a digest in
# a shell variable is not an ecosystem it knows how to read. Those pins rot
# silently: nothing breaks, they just stop receiving the fixes a tag would
# have brought. ci/check-pin-freshness.sh is that half of the mechanism.
#
# Deliberately its own workflow rather than a job in ci.yml, and
# deliberately not a required check. A gate that goes red because upstream
# shipped a release would block every unrelated pull request, and it would
# fail for reasons that have nothing to do with the change under review.
# The verdict here is about the repository, not about a commit.
#
# It reports; it does not raise the upgrade. Opening a pull request from a
# workflow needs "Allow GitHub Actions to create and approve pull
# requests", which is off on this repository and grants the approval half
# along with the create half. That setting stays off by decision.
#
# So the report has to reach somebody without it, and the first two tries
# did not:
#
#   1. The schedule did not fire. Active on main for three days, Monday's
#      window passed, no run at all.
#   2. The manual run that replaced it failed, addressed to the account
#      that last edited the cron, and sent no email.
#
# Hence the push trigger below. A red run here is not a broken commit --
# it is this repository holding a pinned reference that upstream has moved
# past. Read the job's log, bump the pin in ci/scanner-pins.sh, and it
# goes green. It blocks nothing: this is a separate workflow, so it cannot
# appear in ci.yml's `needs:` graph and cannot hold up publish or release,
# and it is not a required check.
name: pin freshness

on:
  # Every push to main, which is the trigger that actually arrives. The
  # schedule below is kept because it catches the weeks nobody pushes --
  # exactly when a pin quietly ages -- but a mechanism that has never once
  # fired is not something to rely on alone.
  #
  # The cost, so it is not discovered later: a handful of registry calls
  # per push, five of which reach Docker Hub. Two are manifest requests,
  # which count against the anonymous rate limit that GitHub runners share
  # by IP; three are tag listings, which do not. If this ever starts
  # failing with a 429 rather than a stale pin, that is the reason.
  push:
    branches: [main]

  schedule:
    # Mondays, after Dependabot's weekly window, so an upgrade week's work
    # arrives together.
    #
    # 06:23 and not 06:00. The first schedule this workflow carried was
    # `0 6 * * 1`, and it did not fire: the workflow was on main from
    # Friday, GitHub listed it active, and Monday 06:00 UTC passed with no
    # run at all. Scheduled workflows are best-effort and are delayed or
    # dropped under load, and the start of an hour is when every cron in
    # the world queues at once. Moving off the boundary is the documented
    # mitigation. Observed once rather than proven, so the next Monday is
    # the check.
    - cron: '23 6 * * 1'
  # So the check can be run on demand, and so a change to this workflow can
  # be exercised before it is merged. It is also the only reason the
  # schedule's failure was noticed rather than assumed away, which is an
  # argument for keeping a manual path on anything that reports by absence.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-freshness
  cancel-in-progress: true

jobs:
  pins:
    name: pinned references against upstream
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checker runs in the digest-pinned builder image, the same one
      # the shipped binary is compiled with, so this step needs no Go
      # toolchain on the runner and no unpinned setup action.
      - name: Pinned references against upstream
        run: ci/check-pin-freshness.sh
