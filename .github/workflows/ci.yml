# The pipeline. Every job above `publish` is a gate. Nothing is written
# anywhere until all of them pass. Each gate is one script under ci/, run
# the same way locally.
#
#   suite       build, vet, race suite, coverage floor, link check (SoftHSM2)
#   sast        Semgrep over this repository's Go code
#   gitleaks    secret scan over the full history
#   deps        dependency vulnerabilities: trivy fs and govulncheck
#   image       the service image: trivy image and SBOM
#   terraform   OpenTofu fmt, validate, trivy config and secrets
#   trustchain  the key inventory against the anchor named by repository
#               variables
#   publish     build, scan, prove the PKCS#11 signing path, push, sign
#               keyless
#   verifyrun   re-check this run's keyless signatures from a checkout
#               that holds no key material
#   release     attach the binary and its keyless bundle to a GitHub
#               Release, on a v<x.y.z> tag
#
# Seven gates are required checks on main: suite, sast, gitleaks, deps,
# image, terraform and trustchain. enforce_admins is on, so the owner is
# not exempt. Force-pushes and deletions are refused. Pull-request review
# is not required. verifyrun runs only after a publish, so it cannot gate
# a merge. A failure there turns main red after the fact.
#
# Everything Go runs inside ci/softhsm2-dev.Dockerfile. The suite needs
# the SoftHSM2 module. A host without the module skips every
# token-touching test and the coverage floor means nothing.
#
# Every third-party reference is pinned: actions by commit SHA, images by
# digest. ci/check-image-pins.sh checks the image half in the suite gate.
#
# The publish job is downstream of all seven gates in the same run, and
# ci/assert-publishable.sh compares their results again at run time.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: build, vet, test, coverage (SoftHSM2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # github.workspace, not $PWD: Actions expands this when the
      # environment is built, and a shell variable would reach docker as
      # four literal characters.
      CACHE_MOUNTS: >-
        -v ${{ github.workspace }}/.local/ci-cache/gomod:/go/pkg/mod
        -v ${{ github.workspace }}/.local/ci-cache/gobuild:/root/.cache/go-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The caches live on the runner and are mounted into the container.
      - name: Restore the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/ci-cache/gomod
            .local/ci-cache/gobuild
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Build the dev container
        run: |
          mkdir -p .local/ci-cache/gomod .local/ci-cache/gobuild
          docker build -f ci/softhsm2-dev.Dockerfile -t hsm-pki-dev .

      # safe.directory: the checkout is owned by the runner's uid and the
      # container runs as root. Without it git refuses the repository and
      # go reports a VCS error.
      - name: gofmt and go vet
        run: |
          docker run --rm -v "$PWD":/repo -w /repo $CACHE_MOUNTS hsm-pki-dev sh -c '
            git config --global --add safe.directory /repo
            unformatted="$(gofmt -l cmd internal ci)"
            if [ -n "$unformatted" ]; then
              echo "gofmt wants to reformat:" >&2
              echo "$unformatted" >&2
              exit 1
            fi
            go vet ./...'

      # The publish guard is tested here because `publish` runs only on a
      # push to main. A guard whose test never runs on the pull request
      # that changes it is not checked.
      - name: Publish-guard selftest
        run: ci/assert-publishable-selftest.sh

      - name: Every third-party image is pinned by digest
        run: ci/check-image-pins.sh

      - name: Every relative link in the documentation resolves
        run: tools/check-public-links.sh

      # -p 1: the vendor backends share a persistent token store, and one
      # invocation that works on every backend is kept.
      - name: Full suite with the race detector
        run: |
          docker run --rm -v "$PWD":/repo -w /repo $CACHE_MOUNTS hsm-pki-dev sh -c '
            git config --global --add safe.directory /repo
            go test -race -p 1 ./...'

      # COVERAGE_BADGE_CHECK recomputes docs/coverage.svg and fails when
      # the committed one disagrees. The badge is checked in like a
      # lockfile, so this job needs no write permission.
      - name: Coverage floor and badge
        run: |
          docker run --rm -v "$PWD":/repo -w /repo $CACHE_MOUNTS \
            -e COVERAGE_BADGE=docs/coverage.svg -e COVERAGE_BADGE_CHECK=1 \
            hsm-pki-dev sh -c '
            git config --global --add safe.directory /repo
            bash ci/coverage.sh -race -p 1'

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # p/golang and p/security-audit, blocking on any finding. Exceptions
      # are nosemgrep comments on the exact line, each with its reason.
      - name: Semgrep
        run: ci/scan-code.sh

  gitleaks:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The subject is the history. A shallow clone would scan only the
          # tip, and ci/scan-secrets.sh refuses one.
          fetch-depth: 0

      - name: Scan every commit
        run: ci/scan-secrets.sh

  deps:
    name: dependency scan (trivy fs, govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # trivy fs asks whether a vulnerable version is present; govulncheck
      # asks whether this code reaches it. Exceptions come only from
      # ci/vuln-allowlist.yaml, which ci/vuln-gate validates first.
      - name: Dependencies and reachable vulnerabilities
        run: ci/scan-deps.sh

  image:
    name: image scan (trivy image + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built here, not pulled: the image scanned has to be the one this
      # commit produces.
      - name: Build the service image
        run: docker build -f deploy/docker/Dockerfile -t hsm-pki-server:ci .

      - name: Vulnerabilities and SBOM
        run: ci/scan-image.sh hsm-pki-server:ci

      # The signing environment is built so that a base-image bump that
      # drops a library the cosign binary needs fails here, not in the
      # publish job.
      - name: Build the cosign image and check its runtime libraries
        run: |
          docker build -f ci/cosign.Dockerfile -t hsm-pki-cosign:ci .
          docker run --rm --entrypoint sh hsm-pki-cosign:ci -c '
            missing=0
            for lib in libpcsclite.so.1 libssl.so.3 libstdc++.so.6 \
                       libgcc_s.so.1 libcrypto.so.3; do
              if ldconfig -p | grep -q "$lib"; then
                echo "ok       $lib"
              else
                echo "MISSING  $lib" >&2
                missing=1
              fi
            done
            exit "$missing"'

      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: .local/scan/sbom.cdx.json
          if-no-files-found: error

  terraform:
    name: infrastructure scan (OpenTofu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fmt -check, validate with -backend=false, trivy config and trivy's
      # secret scanner. There is no plan step: it needs credentials and a
      # deploy target, and neither exists here.
      - name: Format, validate and scan the OpenTofu tree
        run: ci/terraform-scan.sh

  # The key inventory against the trust anchor. The anchor's repository,
  # commit and digest come from repository variables, not from any file in
  # this tree. This job holds no token and no PIN; ci/cosign.sh refuses a
  # PKCS#11 key in verify mode, and the second step proves that refusal.
  #
  # --inventory-only: a build of main carries only the pipeline's keyless
  # signature, which this chain does not accept, so the image half is
  # checked per release rather than on every push.
  trustchain:
    name: verify trust chain (public keys only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HSM_PKI_TRUST_ANCHOR_REPO: ${{ vars.TRUST_ANCHOR_REPO }}
      HSM_PKI_TRUST_ANCHOR_COMMIT: ${{ vars.TRUST_ANCHOR_COMMIT }}
      HSM_PKI_TRUST_ANCHOR_SHA256: ${{ vars.TRUST_ANCHOR_SHA256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Anchor, inventory and listed keys
        run: ci/verify-release.sh --inventory-only

      - name: A verify invocation must refuse a PKCS#11 key
        run: |
          if ci/cosign.sh verify --key "pkcs11:token=x;object=y" scratch 2>/dev/null; then
            echo "cosign.sh accepted a PKCS#11 key in verify mode" >&2
            exit 1
          fi
          echo "refused, as it must"

  # --------------------------------------------------------------------
  # The first job that writes anything, and the only one holding a
  # credential that can. id-token: write is what lets cosign obtain a
  # Fulcio certificate for this run's identity.
  publish:
    name: publish signed image (GHCR)
    needs: [suite, sast, gitleaks, deps, image, terraform, trustchain]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, not just the tip: `git describe --exact-match` decides
          # whether this commit gets a semver tag.
          fetch-depth: 0

      - name: Refuse to publish unless every gate passed
        env:
          PUBLISH_EVENT: ${{ github.event_name }}
          PUBLISH_REF: ${{ github.ref }}
          PUBLISH_GATES: >-
            suite=${{ needs.suite.result }}
            sast=${{ needs.sast.result }}
            gitleaks=${{ needs.gitleaks.result }}
            deps=${{ needs.deps.result }}
            image=${{ needs.image.result }}
            terraform=${{ needs.terraform.result }}
            trustchain=${{ needs.trustchain.result }}
        run: ci/assert-publishable.sh

      # v2 makes the PKCS#11 image signatures in the mechanism test, in the
      # layout Kyverno reads. v3 makes every keyless signature and the
      # release binary's bundle. Each is pinned and verified on its own.
      - name: Fetch and verify cosign, both tracks
        run: |
          HSM_PKI_COSIGN_VERSION=v2 ci/cosign.sh fetch
          HSM_PKI_COSIGN_VERSION=v3 ci/cosign.sh fetch

      # The runner's own GITHUB_TOKEN, minted for this run. No registry
      # password is stored as a secret.
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ci/publish-image.sh builds and scans, runs the PKCS#11 mechanism
      # test against a throwaway registry with a token whose PINs are
      # generated inside that script, then pushes and signs keyless.
      - name: Build, scan, prove the PKCS#11 path, push and sign keyless
        run: |
          HSM_PKI_DOCKER_CONFIG="$HOME/.docker" \
            ci/publish-image.sh "ghcr.io/${GITHUB_REPOSITORY,,}"

      # The binary, its keyless bundle and its digest. The verify job
      # checks them without rebuilding.
      - name: Keep the release binary and its keyless bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ github.sha }}
          path: |
            .local/release/hsm-pki-server
            .local/release/hsm-pki-server.sigstore.json
            .local/release/hsm-pki-server.sha256
          if-no-files-found: error

  # A fresh checkout holding no key material re-derives what the publish
  # job asserted: the keyless signature, both attestations, the provenance
  # content and the binary's bundle, all for this run's exact identity.
  verifyrun:
    name: verify this run's signatures (no key material)
    needs: [publish]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.digest.outputs.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the release binary and its bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binary-${{ github.sha }}
          path: .local/release

      # Resolved by pulling, which is what a consumer does. `docker
      # manifest inspect` can report a different digest for the same tag,
      # because the registry serves a re-encoded manifest.
      - name: Resolve the published digest independently
        id: digest
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull -q "$repo:sha-$GITHUB_SHA" >/dev/null
          digest="$(docker inspect "$repo:sha-$GITHUB_SHA" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^$repo@" | head -1 | cut -d@ -f2)"
          case "$digest" in
            sha256:*) ;;
            *) echo "could not resolve a digest for $repo:sha-$GITHUB_SHA" >&2; exit 1 ;;
          esac
          echo "ref=$repo@$digest" >> "$GITHUB_OUTPUT"
          echo "$repo@$digest"

      - name: Verify the keyless signature, attestations and binary
        env:
          HSM_PKI_KEYLESS_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          chmod +x .local/release/hsm-pki-server
          ci/verify-keyless.sh '${{ steps.digest.outputs.ref }}' \
            --commit "$GITHUB_SHA" \
            --binary .local/release/hsm-pki-server \
            --bundle .local/release/hsm-pki-server.sigstore.json

  # A GitHub Release for a v<x.y.z> tag, carrying the binary, its keyless
  # bundle and its digest. It runs only after the verify job has checked
  # them. contents: write is scoped to this job.
  release:
    name: GitHub Release (v* tags)
    needs: [publish, verifyrun]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the verified release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binary-${{ github.sha }}
          path: .local/release

      - name: Create the release and attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ needs.verifyrun.outputs.ref }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOT
          Image: \`$IMAGE_REF\`

          Signed keyless by \`$IDENTITY\` (issuer https://token.actions.githubusercontent.com),
          with a CycloneDX SBOM attestation and a SLSA v1 provenance attestation.
          The durable counter-signature with image-signing-key-v1 is added by the
          maintainer after this release is created; see README, "Verifying a release".

          Assets: the server binary, its keyless Sigstore bundle, and its SHA-256.
          EOT
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            .local/release/hsm-pki-server \
            .local/release/hsm-pki-server.sigstore.json \
            .local/release/hsm-pki-server.sha256
