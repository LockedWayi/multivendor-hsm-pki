# The service talks to the HSM and to its own store. It never calls the
# Kubernetes API -- not to read a ConfigMap (the kubelet mounts those), not
# for leader election (there is only ever one replica), not for anything.
#
# So "RBAC granting only what the service actually uses" is, correctly, no
# Role and no RoleBinding at all. Writing a minimal Role would grant more
# than nothing while looking careful, which is worse than either honest
# option. The token is not mounted either: a credential a process never uses
# is only ever a credential an attacker can steal (docs/threat-model.md, A3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hsm-pki
  labels:
    app.kubernetes.io/name: hsm-pki
    app.kubernetes.io/component: ca
automountServiceAccountToken: false
