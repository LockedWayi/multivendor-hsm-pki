# EXAMPLE ONLY -- do not fill this in and do not commit a filled copy.
#
# This file exists to document the shape of the Secret the Deployment
# expects. Create the real one out of band, so no PIN ever enters git:
#
#   kubectl -n hsm-pki-dev create secret generic hsm-pki-pin \
#       --from-literal=intermediate-pin='<the token user PIN>'
#
# Prefer a shell that does not record history for that command, or read the
# value from a file with --from-file, because a literal on a command line
# reaches the shell history and the process list (CLAUDE.md §3.1).
#
# A Kubernetes Secret is base64, not encryption. This is the Phase 6
# placeholder the phase file calls for, and the service reads the PIN from
# the environment variable named in config.yaml -- so replacing this with
# Vault later changes the deployment, not the service.
apiVersion: v1
kind: Secret
metadata:
  name: hsm-pki-pin
type: Opaque
stringData:
  intermediate-pin: "CHANGE_ME_DO_NOT_COMMIT"
