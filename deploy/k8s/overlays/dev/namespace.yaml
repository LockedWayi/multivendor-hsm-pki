# Pod Security Admission at `restricted`, enforced rather than warned.
#
# `restricted` is the strictest built-in level: non-root, no privilege
# escalation, all capabilities dropped, a seccomp profile, no host
# namespaces, no hostPath volumes. The base manifest satisfies it already --
# but a namespace that only warns lets a future manifest quietly stop
# satisfying it, and a guardrail nobody can fail is not a guardrail
# (sub-task 4.5).
#
# audit and warn are set alongside enforce so a violation is visible in the
# API server's audit log and at kubectl time, not only as a rejection.
#
# NOTE, and it is the interesting one: `restricted` forbids hostPath
# volumes, and this overlay needs one to deliver the SoftHSM2 module. That
# tension is real and is resolved in module-mount.yaml, not papered over
# here.
apiVersion: v1
kind: Namespace
metadata:
  name: hsm-pki-dev
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
