# gitleaks configuration for this repository (Phase 5.2's gate, pulled
# forward with 5.1 — see docs/phases/phase-5-cicd.md).
#
# The escape hatches here are deliberately of two different shapes, because
# the two kinds of finding they exempt are different in kind:
#
#   - A *recurring public string* gets an exact-match allowlist regex below.
#     `inventory-signing-key-v1` is a published key LABEL — its public half
#     is committed at docs/keys/, so the string can never be a secret, and
#     it legitimately recurs (scripts, keyaudit, tests, docs). A per-commit
#     fingerprint would have to be re-granted on every commit that touches
#     such a line; an exact public string cannot mask anything else.
#   - A *one-off historical finding* gets a commit-pinned fingerprint in
#     .gitleaksignore: the fake credential deliberately planted and removed
#     by Phase 3.6 to prove the Terraform scanner catches one. Editing or
#     moving anything re-triggers, which is the property the phase note
#     asks for.
#
# What is deliberately NOT done: no path allowlists over source (a path
# exemption grows silently) and no rule disabled repository-wide —
# generic-api-key is the rule most likely to catch a real leak.

[extend]
useDefault = true

# Public, published key labels. Matching is anchored to the exact versioned
# label pattern this platform provisions (CLAUDE.md §3.7) so a genuinely
# secret value sitting near the word "key" is still reported.
[[allowlists]]
description = "published signing-key labels are public by construction (their public halves live in docs/keys/)"
regexTarget = "match"
regexes = [
  '''(image|artifact|audit|inventory)-signing-key-v[0-9]+''',
]

# .local/ is gitignored developer state (throwaway tokens, trivy's
# vulnerability database — ~50 spurious hits) and is never committed; the
# path allowlist matters only for working-tree (`gitleaks dir`) scans,
# since a history scan cannot see unversioned files at all.
[[allowlists]]
description = "gitignored local state; never committed, scanned only by directory scans"
paths = [
  '''^\.local/''',
]
